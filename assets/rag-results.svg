<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="CivicLens AI results: top-3 retrieval accuracy rose from about 65 percent to about 85 percent and query latency fell from 1.2 seconds to 0.7 seconds">
  <defs>
    <style>
      .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .g{transform-origin:left center;transform:scaleX(0);animation:gr 1.2s cubic-bezier(.2,.8,.2,1) forwards}
      @keyframes gr{to{transform:scaleX(1)}}
    </style>
    <linearGradient id="good" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2ea043"/><stop offset="1" stop-color="#7cf5b8"/></linearGradient>
  </defs>
  <rect width="1000" height="280" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="t" x="30" y="40" font-size="19" font-weight="700" fill="#e6edf3">CivicLens AI: measured, not guessed</text>
  <text class="t" x="30" y="62" font-size="13" fill="#8b949e">Tuned FAISS chunking and embedding model choice, then re-measured on governance document queries</text>

  <text class="t" x="30" y="105" font-size="15" font-weight="600" fill="#c9d1d9">Top-3 retrieval accuracy</text>
  <text class="t" x="30" y="136" font-size="12" fill="#8b949e">Before</text>
  <rect x="90" y="124" width="700" height="16" rx="8" fill="#161b22"/>
  <rect class="g" x="90" y="124" width="455" height="16" rx="8" fill="#6e7681"/>
  <text class="t" x="808" y="137" font-size="14" fill="#c9d1d9">~65%</text>
  <text class="t" x="30" y="166" font-size="12" fill="#8b949e">After</text>
  <rect x="90" y="154" width="700" height="16" rx="8" fill="#161b22"/>
  <rect class="g" x="90" y="154" width="595" height="16" rx="8" fill="url(#good)" style="animation-delay:.4s"/>
  <text class="t" x="808" y="167" font-size="14" font-weight="700" fill="#7cf5b8">~85%</text>

  <text class="t" x="30" y="205" font-size="15" font-weight="600" fill="#c9d1d9">Average query latency</text>
  <text class="t" x="30" y="236" font-size="12" fill="#8b949e">Before</text>
  <rect x="90" y="224" width="700" height="16" rx="8" fill="#161b22"/>
  <rect class="g" x="90" y="224" width="700" height="16" rx="8" fill="#6e7681" style="animation-delay:.8s"/>
  <text class="t" x="808" y="237" font-size="14" fill="#c9d1d9">~1.2s</text>
  <text class="t" x="30" y="266" font-size="12" fill="#8b949e">After</text>
  <rect x="90" y="254" width="700" height="16" rx="8" fill="#161b22"/>
  <rect class="g" x="90" y="254" width="408" height="16" rx="8" fill="url(#good)" style="animation-delay:1.2s"/>
  <text class="t" x="808" y="267" font-size="14" font-weight="700" fill="#7cf5b8">~0.7s  (~40% faster)</text>
</svg>
