<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="MedAssist AI pipeline: free-text order to Extractor to Safety to Executor to database, with invalid output blocked at the Safety stage">
  <defs>
    <style>
      .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .flow{stroke-dasharray:7 8;animation:m 1.1s linear infinite}
      @keyframes m{to{stroke-dashoffset:-15}}
      .pulse{animation:p 2.4s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:.6}50%{opacity:1}}
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#58a6ff"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#f85149"/></marker>
  </defs>
  <rect width="1000" height="250" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="t" x="30" y="40" font-size="19" font-weight="700" fill="#e6edf3">How MedAssist keeps LLM output safe</text>
  <text class="t" x="30" y="62" font-size="13" fill="#8b949e">Extractor → Safety → Executor: model output is validated before any database action</text>
  <g class="t" font-size="14" font-weight="600">
    <rect x="30" y="100" width="150" height="64" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="105" y="128" text-anchor="middle" fill="#e6edf3">Free-text order</text>
    <text x="105" y="148" text-anchor="middle" font-size="11" font-weight="400" fill="#8b949e">natural language</text>

    <rect class="pulse" x="260" y="100" width="170" height="64" rx="12" fill="#12304a" stroke="#58a6ff"/>
    <text x="345" y="128" text-anchor="middle" fill="#cfe8ff">1 · Extractor</text>
    <text x="345" y="148" text-anchor="middle" font-size="11" font-weight="400" fill="#9ec9ee">Groq LLM + fuzzy match</text>

    <rect class="pulse" x="510" y="100" width="170" height="64" rx="12" fill="#3a2a0a" stroke="#d29922" style="animation-delay:.6s"/>
    <text x="595" y="128" text-anchor="middle" fill="#ffe3a3">2 · Safety</text>
    <text x="595" y="148" text-anchor="middle" font-size="11" font-weight="400" fill="#e8c878">validates model output</text>

    <rect class="pulse" x="760" y="100" width="170" height="64" rx="12" fill="#0f3d2e" stroke="#3fb950" style="animation-delay:1.2s"/>
    <text x="845" y="128" text-anchor="middle" fill="#b7f5c8">3 · Executor</text>
    <text x="845" y="148" text-anchor="middle" font-size="11" font-weight="400" fill="#8fdba5">database action</text>
  </g>
  <line class="flow" x1="180" y1="132" x2="256" y2="132" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#a)"/>
  <line class="flow" x1="430" y1="132" x2="506" y2="132" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#a)"/>
  <line class="flow" x1="680" y1="132" x2="756" y2="132" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M595 164 V205" stroke="#f85149" stroke-width="2.5" fill="none" stroke-dasharray="5 5" marker-end="url(#r)"/>
  <g class="t" font-size="13"><text x="610" y="214" fill="#ff7b72" font-weight="600">Invalid output never reaches the database</text></g>
  <g class="t" font-size="12" fill="#8b949e"><text x="30" y="236">Also: Pytest + Postman tests · Langfuse tracing (latency, token usage, errors)</text></g>
</svg>
